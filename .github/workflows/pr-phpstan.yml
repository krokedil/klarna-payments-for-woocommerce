# Managed by krokedil-baseline, changes here are overwritten on the next sync.
name: PHPStan

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [develop, master]
        paths:
            - "**.php"
            - "phpstan.neon"
            - "phpstan-baseline.neon"
            - "phpstan-bootstrap.php"
            - "composer.json"
            - "composer.lock"
            - "composer-dependencies.json"
            - "composer-dependencies.lock"

permissions:
    contents: read

concurrency:
    group: pr-phpstan-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpstan:
        name: PHPStan static analysis (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # phpVersion in phpstan.neon checks the code against the plugin's minimum PHP version.
                php: ["8.0","8.5"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            # --no-scripts skips project scripts (test environment setup and similar). wpify/scoper
            # is a composer plugin rather than a script, so it still populates dependencies/.
            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --optimize-autoloader --no-scripts

            # An empty dependencies/ would surface as thousands of unknown-class errors
            # rather than an honest failure, so fail loudly here instead.
            - name: Verify scoped dependencies were generated
              run: test -f dependencies/autoload.php || { echo "::error::dependencies/ was not generated by wpify/scoper"; exit 1; }

            - name: Run PHPStan
              run: composer phpstan
