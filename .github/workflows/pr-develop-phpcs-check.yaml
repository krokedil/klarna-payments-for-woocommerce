# Managed by krokedil-baseline, changes here are overwritten on the next sync.
name: PHPCS Check
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master]
    paths:
      - "**.php"
      - "phpcs.xml"
      - "composer.json"
      - "composer.lock"

permissions:
  contents: read
concurrency:
  group: pr-develop-phpcs-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phpcs:
    name: PHPCS (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0","8.5"]
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      # --no-scripts skips project scripts (test environment setup and similar) that PHPCS does not need.
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - name: Get changed PHP files
        id: changed-files
        run: |
          # Get list of changed PHP files (Added, Copied, Modified, Renamed)
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD | grep '\.php$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No PHP files changed in this PR"
            echo "has_php_files=false" >> $GITHUB_OUTPUT
          else
            echo "Changed PHP files:"
            echo "$CHANGED_FILES"
            echo "has_php_files=true" >> $GITHUB_OUTPUT
            # Save to a file to avoid issues with spaces/special chars in filenames
            echo "$CHANGED_FILES" > changed_files.txt
          fi

      - name: Run PHPCS on changed files
        if: steps.changed-files.outputs.has_php_files == 'true'
        run: |
          xargs -a changed_files.txt vendor/bin/phpcs -s --standard=phpcs.xml
