# Deploy to WordPress.org
#
# Triggered when a GitHub Release is published.
# Builds the plugin, deploys to WordPress.org SVN, and attaches the zip
# to the release.
#
# Required secrets: SVN_USERNAME, SVN_PASSWORD (wp.org credentials).

name: Deploy to WordPress.org

permissions:
  contents: write # Required for uploading release assets.

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      # Install with dev dependencies first, needed for PHP Scoper and for the
      # wp-cli i18n commands that npm run build calls through composer i18n.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Build with npm
        run: |
          npm ci
          npm run build

      - name: Remove Composer dev dependencies for the release build
        run: composer install --prefer-dist --no-progress --optimize-autoloader --no-dev

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: klarna-payments-for-woocommerce
          ASSETS_DIR: .wordpress-org

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
